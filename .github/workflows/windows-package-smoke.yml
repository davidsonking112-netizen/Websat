name: Windows package smoke test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:build
      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) {
            throw "electron-builder completed without producing a Windows installer in release/."
          }
          Write-Host "Windows installer produced: $($installer.Name) ($($installer.Length) bytes)"
          if ($installer.Length -lt 1MB) {
            throw "Windows installer is unexpectedly small; refusing to treat this as a successful package smoke test."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: websat-windows-installer-smoke
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
